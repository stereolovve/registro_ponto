{% if messages %}
<div class="fixed top-20 right-4 z-50 space-y-2">
    {% for message in messages %}
    <div class="flex items-center p-4 rounded-lg shadow-lg {% if message.tags == 'error' %}bg-red-600{% elif message.tags == 'success' %}bg-green-600{% elif message.tags == 'warning' %}bg-yellow-600{% else %}bg-blue-600{% endif %} text-white animate-fade-in">
        <div class="mr-3">
            {% if message.tags == 'error' %}
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
            {% elif message.tags == 'success' %}
            <i data-lucide="check-circle" class="w-5 h-5"></i>
            {% elif message.tags == 'warning' %}
            <i data-lucide="alert-triangle" class="w-5 h-5"></i>
            {% else %}
            <i data-lucide="info" class="w-5 h-5"></i>
            {% endif %}
        </div>
        <div class="flex-1">
            {{ message }}
        </div>
        <button onclick="this.parentElement.remove()" class="ml-3 hover:opacity-75">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    {% endfor %}
</div>

<script>
    // Auto-dismiss messages after 5 seconds
    setTimeout(() => {
        document.querySelectorAll('.animate-fade-in').forEach(el => {
            el.style.transition = 'opacity 0.5s';
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 500);
        });
    }, 5000);
</script>
{% endif %}

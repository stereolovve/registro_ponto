{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Controle de Ponto{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/timesheet-light.css' %}?v=2">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen" style="background: #ffffff;">
    <!-- Simple Top Navigation -->
    <nav style="background: #ffffff; border-bottom: 1px solid #e5e7eb; position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 64px;">
        <div style="max-width: 1280px; margin: 0 auto; padding: 0 1rem; height: 100%; display: flex; align-items: center; justify-content: space-between;">

            <!-- Navigation Links -->
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <a href="{% url 'dashboard' %}" style="padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; text-decoration: none; {% if request.resolver_match.url_name == 'dashboard' %}background: #16a34a; color: white;{% else %}color: #1f2937;{% endif %}">
                    Dashboard
                </a>
                <a href="{% url 'timesheet' %}" style="padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; text-decoration: none; {% if request.resolver_match.url_name == 'timesheet' %}background: #16a34a; color: white;{% else %}color: #1f2937;{% endif %}">
                    Timesheet
                </a>
                <a href="{% url 'perfil' %}" style="padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; text-decoration: none; {% if request.resolver_match.url_name == 'perfil' or request.resolver_match.url_name == 'perfil_editar' %}background: #16a34a; color: white;{% else %}color: #1f2937;{% endif %}">
                    Perfil
                </a>
            </div>

            <!-- User Info + Logout -->
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span style="font-size: 0.875rem; color: #6b7280;">
                    {{ user.first_name|default:user.username }}
                </span>
                <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" style="padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; background: transparent; border: none; color: #1f2937; cursor: pointer; display: flex; align-items: center; gap: 0.25rem;">
                        <i data-lucide="log-out" style="width: 1rem; height: 1rem;"></i>
                        Sair
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div style="margin-top: 64px; padding: 2rem 1rem; max-width: 1280px; margin-left: auto; margin-right: auto;">
        <!-- Messages -->
        {% include 'components/messages.html' %}

        <!-- Page Content -->
        {% block content %}
        {% endblock %}
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>

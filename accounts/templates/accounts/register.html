{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Controle de Ponto</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 0; background: #f9fafb;">
    <!-- Register Card -->
    <div style="width: 100%; max-width: 28rem; padding: 0 1rem;">
        <div style="background: white; border-radius: 8px; border: 1px solid #e5e7eb; padding: 2rem;">
            <!-- Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.5rem; font-weight: 600; color: #1f2937;">Criar Conta</h1>
                <p style="font-size: 0.875rem; color: #6b7280; margin-top: 0.5rem;">Preencha os dados para se cadastrar</p>
            </div>

            <!-- Messages -->
            {% if messages %}
            <div style="margin-bottom: 1rem;">
                {% for message in messages %}
                <div style="display: flex; align-items: center; padding: 0.75rem; border-radius: 8px; border: 1px solid {% if message.tags == 'error' %}#ef4444{% else %}#16a34a{% endif %}; background: {% if message.tags == 'error' %}rgba(239, 68, 68, 0.1){% else %}rgba(22, 163, 74, 0.1){% endif %}; color: {% if message.tags == 'error' %}#dc2626{% else %}#16a34a{% endif %}; margin-bottom: 0.5rem;">
                    <i data-lucide="alert-circle" style="width: 1rem; height: 1rem; margin-right: 0.5rem;"></i>
                    <span style="font-size: 0.875rem;">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Register Form -->
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}

                <div style="margin-bottom: 1rem;">
                    <label for="username" style="display: block; font-size: 0.875rem; font-weight: 500; color: #1f2937; margin-bottom: 0.25rem;">
                        Usuário *
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        required
                        style="display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; color: #1f2937; font-size: 0.875rem;"
                        placeholder="Digite seu usuário"
                    >
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="first_name" style="display: block; font-size: 0.875rem; font-weight: 500; color: #1f2937; margin-bottom: 0.25rem;">
                        Primeiro Nome
                    </label>
                    <input
                        type="text"
                        name="first_name"
                        id="first_name"
                        style="display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; color: #1f2937; font-size: 0.875rem;"
                        placeholder="Digite seu primeiro nome"
                    >
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="last_name" style="display: block; font-size: 0.875rem; font-weight: 500; color: #1f2937; margin-bottom: 0.25rem;">
                        Sobrenome
                    </label>
                    <input
                        type="text"
                        name="last_name"
                        id="last_name"
                        style="display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; color: #1f2937; font-size: 0.875rem;"
                        placeholder="Digite seu sobrenome"
                    >
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="email" style="display: block; font-size: 0.875rem; font-weight: 500; color: #1f2937; margin-bottom: 0.25rem;">
                        E-mail *
                    </label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        required
                        style="display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; color: #1f2937; font-size: 0.875rem;"
                        placeholder="seu@email.com"
                    >
                </div>

                <div style="margin-bottom: 1rem;">
                    <label for="password" style="display: block; font-size: 0.875rem; font-weight: 500; color: #1f2937; margin-bottom: 0.25rem;">
                        Senha *
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        required
                        style="display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; color: #1f2937; font-size: 0.875rem;"
                        placeholder="Mínimo 6 caracteres"
                    >
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label for="password2" style="display: block; font-size: 0.875rem; font-weight: 500; color: #1f2937; margin-bottom: 0.25rem;">
                        Confirmar Senha *
                    </label>
                    <input
                        type="password"
                        name="password2"
                        id="password2"
                        required
                        style="display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; background: white; color: #1f2937; font-size: 0.875rem;"
                        placeholder="Digite a senha novamente"
                    >
                </div>

                <button
                    type="submit"
                    style="width: 100%; display: flex; justify-content: center; align-items: center; padding: 0.625rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; background: #16a34a; color: white; border: none; cursor: pointer;"
                >
                    <i data-lucide="user-check" style="width: 1rem; height: 1rem; margin-right: 0.5rem;"></i>
                    Cadastrar
                </button>
            </form>

            <!-- Login Link -->
            <div style="margin-top: 1.5rem; text-align: center;">
                <p style="font-size: 0.875rem; color: #6b7280;">
                    Já tem uma conta?
                    <a href="{% url 'login' %}" style="font-weight: 500; color: #16a34a; text-decoration: none;">
                        Faça login
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

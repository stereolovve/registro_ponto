{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Controle de Ponto</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body class="min-h-screen flex items-center justify-center py-12">
    <!-- Theme Toggle -->
    <div class="absolute top-4 right-4">
        <button onclick="toggleTheme()" class="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300">
            <i data-lucide="sun" id="theme-icon-light" class="w-5 h-5 hidden dark:inline"></i>
            <i data-lucide="moon" id="theme-icon-dark" class="w-5 h-5 inline dark:hidden"></i>
        </button>
    </div>

    <!-- Register Card -->
    <div class="w-full max-w-md px-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div class="p-3 bg-blue-600 rounded-full">
                        <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
                    </div>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Criar Conta</h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Preencha os dados para se cadastrar</p>
            </div>

            <!-- Messages -->
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                <div class="flex items-center p-3 rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% else %}bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200{% endif %}">
                    <i data-lucide="alert-circle" class="w-4 h-4 mr-2"></i>
                    <span class="text-sm">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Register Form -->
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}

                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Usuário *
                        </label>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Digite seu usuário"
                        >
                    </div>

                    <!-- First Name -->
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Primeiro Nome
                        </label>
                        <input
                            type="text"
                            name="first_name"
                            id="first_name"
                            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Digite seu primeiro nome"
                        >
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Sobrenome
                        </label>
                        <input
                            type="text"
                            name="last_name"
                            id="last_name"
                            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Digite seu sobrenome"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            E-mail *
                        </label>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="seu@email.com"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Senha *
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Mínimo 6 caracteres"
                        >
                    </div>

                    <!-- Password Confirmation -->
                    <div>
                        <label for="password2" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                            Confirmar Senha *
                        </label>
                        <input
                            type="password"
                            name="password2"
                            id="password2"
                            required
                            class="block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Digite a senha novamente"
                        >
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    >
                        <i data-lucide="user-check" class="w-4 h-4 mr-2"></i>
                        Cadastrar
                    </button>
                </div>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    Já tem uma conta?
                    <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 dark:hover:text-blue-300">
                        Faça login
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

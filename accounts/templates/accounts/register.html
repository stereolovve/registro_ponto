{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Controle de Ponto</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body class="min-h-screen flex items-center justify-center py-12">
    <!-- Register Card -->
    <div class="w-full max-w-md px-4">
        <div class="bg-card rounded-lg border border-border p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-semibold text-foreground">Criar Conta</h1>
                <p class="text-sm text-muted-foreground mt-2">Preencha os dados para se cadastrar</p>
            </div>

            <!-- Messages -->
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                <div class="flex items-center p-3 rounded-lg border {% if message.tags == 'error' %}bg-destructive/10 border-destructive text-destructive{% else %}bg-primary/10 border-primary text-primary{% endif %}">
                    <i data-lucide="alert-circle" class="w-4 h-4 mr-2"></i>
                    <span class="text-sm">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Register Form -->
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}

                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-foreground mb-1">
                            Usuário *
                        </label>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            required
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Digite seu usuário"
                        >
                    </div>

                    <!-- First Name -->
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-foreground mb-1">
                            Primeiro Nome
                        </label>
                        <input
                            type="text"
                            name="first_name"
                            id="first_name"
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Digite seu primeiro nome"
                        >
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-foreground mb-1">
                            Sobrenome
                        </label>
                        <input
                            type="text"
                            name="last_name"
                            id="last_name"
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Digite seu sobrenome"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-foreground mb-1">
                            E-mail *
                        </label>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            required
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="seu@email.com"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-foreground mb-1">
                            Senha *
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            required
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Mínimo 6 caracteres"
                        >
                    </div>

                    <!-- Password Confirmation -->
                    <div>
                        <label for="password2" class="block text-sm font-medium text-foreground mb-1">
                            Confirmar Senha *
                        </label>
                        <input
                            type="password"
                            name="password2"
                            id="password2"
                            required
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Digite a senha novamente"
                        >
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="w-full flex justify-center items-center py-2 px-4 rounded-md text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-ring"
                    >
                        <i data-lucide="user-check" class="w-4 h-4 mr-2"></i>
                        Cadastrar
                    </button>
                </div>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-muted-foreground">
                    Já tem uma conta?
                    <a href="{% url 'login' %}" class="font-medium text-primary hover:underline">
                        Faça login
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Controle de Ponto</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body class="min-h-screen flex items-center justify-center">
    <!-- Login Card -->
    <div class="w-full max-w-md px-4">
        <div class="bg-card rounded-lg border border-border p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-semibold text-foreground">Sistema de Ponto</h1>
                <p class="text-sm text-muted-foreground mt-2">Entre com suas credenciais</p>
            </div>

            <!-- Messages -->
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                <div class="flex items-center p-3 rounded-lg border {% if message.tags == 'error' %}bg-destructive/10 border-destructive text-destructive{% else %}bg-primary/10 border-primary text-primary{% endif %}">
                    <i data-lucide="alert-circle" class="w-4 h-4 mr-2"></i>
                    <span class="text-sm">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-foreground mb-1">
                            Usuário
                        </label>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            required
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Digite seu usuário"
                            autofocus
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-foreground mb-1">
                            Senha
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            required
                            class="block w-full px-3 py-2 border border-input rounded-md bg-background text-foreground placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
                            placeholder="Digite sua senha"
                        >
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="w-full flex justify-center items-center py-2 px-4 rounded-md text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-ring"
                    >
                        <i data-lucide="log-in" class="w-4 h-4 mr-2"></i>
                        Entrar
                    </button>
                </div>
            </form>

            <!-- Register Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-muted-foreground">
                    Não tem uma conta?
                    <a href="{% url 'register' %}" class="font-medium text-primary hover:underline">
                        Cadastre-se
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
